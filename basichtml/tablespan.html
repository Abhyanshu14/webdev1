<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table span</title>
</head>
<body>
    <table border="1">
        <caption>span </caption>
        <tr>
            <th>sr </th>
            <th>name</th>
            <th>course</th>
        </tr>
        <tr>
            <td rowspan="2">1</td>
            <td rowspan="2">adam</td>
            <td>python</td>
        </tr>
        <tr>
            <td>java</td>
        </tr>
        <tr>
            <td rowspan="2">2</td>
            <td rowspan="2">b0b</td>
            <td>c++</td>
        </tr>
        <tr>
            <td>java</td>
        </tr>

    </table>
</body>
</html>
